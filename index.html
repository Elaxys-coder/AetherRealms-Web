<!DOCTYPE html>
<html lang="fr">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>AetherRealms - Serveur Minecraft</title>
     <link rel="stylesheet" href="style.css">
</head>

<body>
     <header class="hero">
          <div class="overlay">
               <h1>AetherRealms</h1>
               <p>Rejoins une aventure Minecraft unique !</p>

               <div class="server-status-card">
                    <div class="status-header">
                         <span id="status-indicator" class="indicator offline"></span>
                         <span id="status-text">Vérification du statut...</span>
                    </div>
                    <p id="player-count">Joueurs en ligne : --/--</p>
                    <div class="ping" id="ping-display">Ping : -- ms</div>
               </div>

               <button class="ip-btn" onclick="copyServerIP()">
                    📋 Copier l'IP : <span id="server-ip">play.aetherrealms.net</span>
               </button>
          </div>
     </header>

     <div id="toast" class="toast">IP copiée dans le presse-papier !</div>

     <script src="script.js"></script>
</body>

</html>
